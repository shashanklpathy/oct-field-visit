<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="description" content="A virtual field visit to training centres in Tamil Nadu, built from real field observations.">
  <title>Inside the Classroom: A field visit to Tamil Nadu, India</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="home" data-base="">
  <a class="skip-link" href="#play" data-s="nav.skip"></a>
  <header id="site-header"></header>

  <main id="main">
    <div class="wrap">
      <section class="hero" aria-labelledby="home-title">
        <div class="hero-title">
          <h1 id="home-title" data-s="home.title"></h1>
          <p class="subtitle" data-s="home.subtitle"></p>
        </div>
        <p class="lede" data-s="home.lede"></p>
        <noscript><p class="callout">This experience needs JavaScript. Please turn it on and reload the page.</p></noscript>
      </section>

      <section class="game" id="play" aria-label="Field visit">
        <div class="screen" id="screen-setup"></div>
        <div class="screen" id="screen-brief" hidden></div>
        <div class="screen" id="screen-arrival" hidden></div>
        <div class="screen" id="screen-play" hidden></div>
        <div class="screen" id="screen-reveal" hidden></div>
        <div class="screen" id="screen-consolidate" hidden></div>
        <div class="screen" id="screen-reflect" hidden></div>
        <div class="screen" id="screen-end" hidden></div>
      </section>

      <section id="library"></section>
    </div>
  </main>

  <footer id="site-footer"></footer>
  <div id="live" class="visually-hidden" aria-live="polite" role="status"></div>

  <script src="js/content.js"></script>
  <script src="js/scenes.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
